<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>테트리스</title>
  </head>
  <body>
    <main class="game">
      <section class="hold-box">
        <h2>HOLD</h2>
        <canvas id="hold"></canvas>
      </section>
      <dl class="stats">
        <dt>SCORE</dt>
        <dd id="score">0</dd>
        <dt>LEVEL</dt>
        <dd id="level">1</dd>
        <dt>LINES</dt>
        <dd id="lines">0</dd>
      </dl>
      <button
        id="pause-btn"
        class="pause-btn"
        type="button"
        data-action="pause"
        aria-label="일시정지"
      >
        ⏸
      </button>
      <div id="board-slot" class="board-slot">
        <div class="board-wrap">
          <canvas id="board"></canvas>
          <div id="overlay" class="overlay"></div>
        </div>
      </div>
      <section class="next-box">
        <h2>NEXT</h2>
        <canvas id="next"></canvas>
      </section>
      <div class="controls" aria-label="터치 조작">
        <button type="button" data-action="hold">홀드</button>
        <button type="button" data-action="rotateCCW" aria-label="반시계 방향 회전">↺</button>
        <button type="button" data-action="rotateCW" aria-label="시계 방향 회전">↻</button>
        <button type="button" data-action="hardDrop">하드드롭</button>
        <button type="button" class="wide" data-action="left" aria-label="왼쪽">←</button>
        <button type="button" class="wide" data-action="softDrop" aria-label="소프트드롭">↓</button>
        <button type="button" class="wide" data-action="right" aria-label="오른쪽">→</button>
      </div>
    </main>
    <div class="rotate-notice">세로로 돌려 주세요</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
